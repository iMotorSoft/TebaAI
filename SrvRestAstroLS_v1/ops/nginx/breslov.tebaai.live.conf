server {
    server_name breslov.tebaai.live;
    root /home/administrator/project/iMotorSoft/ai/TebaAI/SrvRestAstroLS_v1/astro/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ ^/(?:\.git(?:/|$)|\.env(?:/|$)|backend(?:/|$)|data(?:/|$)|reports(?:/|$)) {
        return 404;
    }

    location = / {
        try_files /breslov/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:7008/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/breslov.tebaai.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/breslov.tebaai.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = breslov.tebaai.live) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name breslov.tebaai.live;
    return 404;
}
